# Render Blueprint for the FastAPI API.
# Root directory is backend/

services:
  - type: web
    name: shift-tracker-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CORS_ORIGINS
        sync: false